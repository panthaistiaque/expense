<div xmlns:th="http://www.thymeleaf.org"
     class="modal fade" id="projectDepositsModal" tabindex="-1"
     aria-labelledby="projectDepositsTitle" aria-hidden="true"
     th:fragment="projectDepositsModal">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 rounded-4 shadow">
            <div class="modal-header border-0">
                <div>
                    <div class="small text-muted">Contributor deposits</div>
                    <h2 class="modal-title fs-5 fw-bold" id="projectDepositsTitle">Project deposits</h2>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-0">
                <section id="depositEntrySection" class="p-3 rounded-3 bg-light mb-4">
                    <h3 class="h6 mb-3">Record received deposit</h3>
                    <form id="projectDepositForm" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="depositContributor">Contributor</label>
                                <select class="form-select" id="depositContributor" name="contributorId" required>
                                    <option value="">Choose contributor</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="depositAmount">Amount</label>
                                <input class="form-control" id="depositAmount" name="amount" type="number"
                                       min="0.01" step="0.01" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="depositDate">Date received</label>
                                <input class="form-control" id="depositDate" name="depositDate" type="date" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="depositDetails">Details <span class="text-muted">(optional)</span></label>
                                <input class="form-control" id="depositDetails" name="details" maxlength="500"
                                       placeholder="e.g. Advance for hotel booking">
                            </div>
                            <div class="col-12 d-flex justify-content-end">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-primary">Save deposit</button>
                            </div>
                        </div>
                    </form>
                </section>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h3 class="h6 mb-0">Deposit history</h3>
                    <span class="small text-muted">Total received: <strong id="projectDepositHistoryTotal">0.00</strong></span>
                </div>
                <div class="table-responsive border rounded-3">
                    <table class="table table-sm table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr><th>Date</th><th>Contributor</th><th>Details</th><th class="text-end">Amount</th><th>Action</th></tr>
                        </thead>
                        <tbody id="projectDepositHistoryRows"></tbody>
                    </table>
                </div>
                <div id="projectDepositHistoryEmpty" class="text-center text-muted py-4 d-none">No deposits recorded yet.</div>
                <input type="hidden" id="depositDeleteCsrf"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
