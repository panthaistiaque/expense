<div xmlns:th="http://www.thymeleaf.org"
     class="modal fade" id="projectRulesModal" tabindex="-1"
     aria-labelledby="projectRulesTitle" aria-hidden="true"
     th:fragment="projectRulesModal">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="small text-muted">Project rule</div>
                    <h2 class="modal-title fs-5" id="projectRulesTitle">Expense split</h2>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="projectRulesForm" method="post">
                <div class="modal-body">
                    <p class="small text-muted">Set each participant’s share of the total project expenses. Shares must add up to 100%.</p>
                    <div class="mb-3">
                        <label class="form-label" for="ownerSharePercent"><span id="ownerShareName">Owner</span> share (%)</label>
                        <input type="number" class="form-control" id="ownerSharePercent"
                               name="ownerSharePercent" min="0" max="100" step="1" value="100" required>
                    </div>
                    <div id="projectRuleContributorShares"></div>
                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <span class="fw-semibold">Total share</span>
                        <span class="fw-bold" id="projectRuleShareTotal">100%</span>
                    </div>
                    <div class="form-text mt-2">Suggested settlements will compare these shares with the expenses each person paid.</div>
                </div>
                <div class="modal-footer">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveProjectRules">Save rule</button>
                </div>
            </form>
        </div>
    </div>
</div>
