<div xmlns:th="http://www.thymeleaf.org" th:fragment="accountMenu(username, ownerImageUrl, userEmail)"
     class="dropdown account-menu">
    <button class="btn account-menu-toggle" type="button" data-bs-toggle="dropdown"
            aria-expanded="false" th:attr="aria-label=${'Open account menu for ' + username}">
        <img th:if="${ownerImageUrl != null and !#strings.isEmpty(ownerImageUrl)}"
             th:src="${ownerImageUrl}" class="account-avatar rounded-circle" width="40" height="40"
             alt="" decoding="async">
        <span th:if="${ownerImageUrl == null or #strings.isEmpty(ownerImageUrl)}"
              class="account-avatar account-avatar-initial rounded-circle"
              th:text="${#strings.substring(username == null or #strings.isEmpty(username) ? 'U' : username, 0, 1)}">U</span>
    </button>
    <div class="dropdown-menu dropdown-menu-end account-dropdown">
        <div class="account-dropdown-header">
            <img th:if="${ownerImageUrl != null and !#strings.isEmpty(ownerImageUrl)}"
                 th:src="${ownerImageUrl}" class="account-dropdown-avatar rounded-circle"
                 width="52" height="52" th:alt="${username + ' profile photo'}" decoding="async">
            <span th:if="${ownerImageUrl == null or #strings.isEmpty(ownerImageUrl)}"
                  class="account-dropdown-avatar account-avatar-initial rounded-circle"
                  th:text="${#strings.substring(username == null or #strings.isEmpty(username) ? 'U' : username, 0, 1)}">U</span>
            <div class="account-dropdown-identity">
                <div class="account-dropdown-label">Signed in as</div>
                <div class="fw-semibold text-truncate" th:text="${username}">User</div>
                <div class="small text-muted text-break" th:text="${userEmail}">user@example.com</div>
            </div>
        </div>
        <div class="dropdown-divider"></div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="dropdown-item account-logout">
                <svg class="account-logout-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M10 17l5-5-5-5M15 12H3m9-7h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6"
                          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Logout
            </button>
        </form>
    </div>
</div>
