<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="modal fade" tabindex="-1" aria-hidden="true"
     th:fragment="expenseEntryModal(modalId, modalTitle, fromProject, dialogSize)"
     th:id="${modalId}" th:attr="aria-labelledby=${modalId + 'Label'}">
    <div class="modal-dialog modal-dialog-centered" th:classappend="${dialogSize}">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" th:id="${modalId + 'Label'}" th:text="${modalTitle}">New Expense</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/expenses}" th:object="${expense}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input th:if="${fromProject}" type="hidden" name="fromProject" value="true">
                    <div class="mb-3">
                        <label for="expenseProjectName" class="form-label">Project</label>
                        <select class="form-select" th:field="*{projectName}" th:errorclass="is-invalid"
                                id="expenseProjectName" required>
                            <option value="">Choose project</option>
                            <option th:each="projectName : ${projectNames}"
                                    th:value="${projectName}"
                                    th:text="${projectName}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{projectName}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="expenseDate" class="form-label">Expense Date</label>
                        <input type="date" class="form-control" th:field="*{expenseDate}"
                               th:errorclass="is-invalid" id="expenseDate"
                               th:data-default-date="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                        <div class="invalid-feedback" th:errors="*{expenseDate}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="expenseAmount" class="form-label">Amount</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{amount}"
                               th:errorclass="is-invalid" id="expenseAmount" placeholder="0.00" required>
                        <div class="invalid-feedback" th:errors="*{amount}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="expenseParticulars" class="form-label">Particulars</label>
                        <input type="text" class="form-control" th:field="*{particulars}"
                               th:errorclass="is-invalid" id="expenseParticulars" placeholder="Description" required>
                        <div class="invalid-feedback" th:errors="*{particulars}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="expenseCategory" class="form-label">Category</label>
                        <select class="form-select" th:field="*{category}" th:errorclass="is-invalid"
                                id="expenseCategory" required>
                            <option value="">Choose category</option>
                            <option th:each="categoryName : ${categories}"
                                    th:value="${categoryName}"
                                    th:text="${categoryName}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{category}"></div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Expense</button>
                    </div>
                </form>
            </div>
            <script>
                (() => {
                    const expenseDateInput = document.getElementById('expenseDate');
                    const setDefaultExpenseDate = () => {
                        if (expenseDateInput && !expenseDateInput.value && expenseDateInput.dataset.defaultDate) {
                            expenseDateInput.value = expenseDateInput.dataset.defaultDate;
                        }
                    };
                    setDefaultExpenseDate();
                    const expenseModal = expenseDateInput ? expenseDateInput.closest('.modal') : null;
                    if (expenseModal) {
                        expenseModal.addEventListener('show.bs.modal', setDefaultExpenseDate);
                    }
                })();
            </script>
        </div>
    </div>
</div>

<div class="modal fade" id="editExpenseModal" tabindex="-1" aria-labelledby="editExpenseModalLabel"
     aria-hidden="true" th:fragment="expenseEditModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="editExpenseForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="editExpenseModalLabel">Edit Expense</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editExpenseDate" class="form-label">Expense Date</label>
                        <input type="date" class="form-control" id="editExpenseDate" name="expenseDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="editExpenseAmount" class="form-label">Amount</label>
                        <input type="number" step="0.01" min="0.01" class="form-control"
                               id="editExpenseAmount" name="amount" required>
                    </div>
                    <div class="mb-3">
                        <label for="editExpenseParticulars" class="form-label">Particulars</label>
                        <input type="text" class="form-control" id="editExpenseParticulars" name="particulars" required>
                    </div>
                    <div>
                        <label for="editExpenseCategory" class="form-label">Category</label>
                        <select class="form-select" id="editExpenseCategory" name="category" required>
                            <option value="">Choose category</option>
                            <option th:each="categoryName : ${categories}"
                                    th:value="${categoryName}"
                                    th:text="${categoryName}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
