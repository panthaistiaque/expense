<div xmlns:th="http://www.thymeleaf.org"
     class="modal fade" id="contributorModal" tabindex="-1"
     aria-labelledby="contributorModalLabel" aria-hidden="true"
     th:fragment="contributorManagementModal">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="contributorModalLabel">Manage Contributors</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <section class="mb-4" aria-labelledby="projectContributorListTitle">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <h3 class="h6 mb-0" id="projectContributorListTitle">Current contributors</h3>
                        <span class="badge rounded-pill text-bg-light border" id="projectContributorCount">0</span>
                    </div>
                    <div class="list-group project-contributor-list" id="projectContributorList"></div>
                    <div class="small text-muted py-2 d-none" id="noProjectContributors">
                        No contributors have been added to this project.
                    </div>
                    <div class="form-text mt-2">
                        View is on by default. Save/Edit access lets contributors manage their own expenses and requires View access.
                    </div>
                </section>
                <input type="hidden" id="contributorCsrfToken"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div id="addContributorSection">
                    <hr>
                    <div class="small fw-semibold mb-3">Add a contributor</div>
                    <form id="contributorForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label for="contributorEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="contributorEmail" name="email" required>
                        </div>
                        <div class="form-text mb-3">Their Google name and photo appear after they sign in.</div>
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-success">Add Contributor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
