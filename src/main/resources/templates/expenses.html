<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17233c; --muted: #748198; --accent: #5667e8; --line: #e8edf5; }
        html, body { min-height: 100%; overflow-x: hidden; }
        body { min-height: 100vh; color: var(--ink); background: #f5f7fb !important; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .navbar { height: 68px; background: rgba(255,255,255,.96) !important; border-bottom: 1px solid var(--line); }
        .navbar-brand { color: var(--ink) !important; letter-spacing: -.03em; }
        .brand-mark { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; margin-right: .55rem; border-radius: 11px; color: #fff; background: linear-gradient(135deg,#6576f5,#8b5cf6); font-weight: 800; }
        .user-label { color: #59667d; }
        .sidebar { width: 248px; top: 68px; height: calc(100vh - 68px); overflow-y: auto; border-color: var(--line) !important; }
        .sidebar .nav-link { padding: .7rem .85rem; border-radius: .75rem; color: #66738b; font-weight: 500; transition: .18s ease; }
        .sidebar .nav-link:hover { color: var(--accent); background: #f5f6ff; }
        .sidebar .nav-link.active { background: #eef0ff; color: #4b5bd4; font-weight: 650; }
        .sidebar-label { color: #a0a9ba; font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        .main-content { box-sizing: border-box; max-width: 100%; }
        .page-heading h1 { letter-spacing: -.04em; font-weight: 700; }
        .page-heading p, .text-muted { color: var(--muted) !important; }
        .card, .table-responsive { border: 1px solid var(--line) !important; border-radius: 1rem; box-shadow: 0 5px 22px rgba(34,49,84,.045) !important; }
        .card-header, .card-footer { border-color: var(--line); }
        .form-select, .form-control { min-height: 44px; border-color: #dfe5ef; border-radius: .7rem; }
        .form-select:focus, .form-control:focus { border-color: #909bfa; box-shadow: 0 0 0 .2rem rgba(86,103,232,.12); }
        .btn { border-radius: .7rem; font-weight: 600; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: #4656d2; border-color: #4656d2; }
        .btn-outline-light { color: #59667d; border-color: #dfe5ef; }
        .table { --bs-table-bg: transparent; }
        .table thead th { padding-top: .8rem; padding-bottom: .8rem; color: #78849a; background: #f8f9fc; border-bottom-color: var(--line); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
        .table tbody td { padding-top: .75rem; padding-bottom: .75rem; border-color: #eff2f7; }
        .modal-content { border: 0; border-radius: 1rem; box-shadow: 0 24px 70px rgba(25,36,64,.18); }
        .offcanvas { border: 0; }
        @media (min-width: 768px) {
            .main-content {
                margin-left: 248px;
                width: calc(100% - 248px);
            }
        }
        @media (max-width: 575.98px) { .navbar { height: 60px; } .main-content { padding-top: 1.25rem !important; } .page-heading { align-items: flex-start !important; gap: 1rem; } }
    </style>
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-light sticky-top">
    <div class="container-fluid">
        <button class="navbar-toggler d-md-none me-2 border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-label="Open menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand fw-semibold d-flex align-items-center" href="/"><span class="brand-mark">E</span>Expense Tracker</a>
        <div th:replace="~{fragments/account-menu :: accountMenu(username=${username}, ownerImageUrl=${ownerImageUrl}, userEmail=${userEmail})}"></div>
    </div>
</nav>

<div th:replace="~{fragments/sidebar :: workspaceSidebar('expenses')}"></div>

<main class="main-content container-fluid px-3 px-md-4 py-4">
    <div class="page-heading d-flex justify-content-between align-items-center mb-4">
        <div><h1 class="h3 mb-1">Expenses</h1><p class="mb-0">Track and manage your project spending.</p></div>
        <button th:if="${!#lists.isEmpty(projectNames)}" type="button" class="btn btn-primary"
                data-bs-toggle="modal" data-bs-target="#expenseModal">
            Add Expense
        </button>
    </div>

    <form class="card border-0 shadow-sm mb-4" method="get" th:action="@{/expenses}">
        <div class="card-body row g-3 align-items-end">
            <div class="col-sm-6 col-md-4">
                <label for="projectFilter" class="form-label">Project</label>
                <select class="form-select" id="projectFilter" name="project" onchange="this.form.submit()">
                    <option value="">All Projects</option>
                    <option th:each="projectName : ${projects}"
                            th:value="${projectName}"
                            th:text="${projectName}"
                            th:selected="${projectName == selectedProject}"></option>
                </select>
            </div>
        </div>
    </form>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:replace="~{fragments/expense-modals :: expenseEntryModal('expenseModal', 'New Expense', false, 'modal-lg')}"></div>
    <div th:replace="~{fragments/expense-modals :: expenseEditModal}"></div>

    <div class="card border-0 overflow-hidden">
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <h2 class="h5 mb-0">Expense List</h2>
        <div class="fw-semibold text-nowrap">Total: <span th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">0.00</span></div>
    </div>
    <div class="table-responsive border-0 rounded-0 shadow-none">
        <table class="table table-striped table-sm table-hover mb-0 align-middle">
            <thead>
            <tr>
                <th>Project</th>
                <th>Date</th>
                <th>Particulars</th>
                <th>Category</th>
                <th>Added By</th>
                <th class="text-end">Amount</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="7" class="text-center text-muted py-4">No expense entries yet.</td>
            </tr>
            <tr th:each="entry : ${expenses}">
                <td th:text="${entry.projectName}"></td>
                <td th:text="${#temporals.format(entry.expenseDate, 'dd MMM yyyy')}"></td>
                <td th:text="${entry.particulars}"></td>
                <td><span class="badge text-bg-secondary" th:text="${entry.category}"></span></td>
                <td class="text-center">
                    <img th:if="${entry.ownerSubject != null and userProfileImages[entry.ownerSubject] != null}"
                         th:src="${userProfileImages[entry.ownerSubject]}"
                         class="rounded-circle submitter-avatar" width="32" height="32"
                         th:title="${entry.addedByName != null ? entry.addedByName : 'Owner'}"
                         th:alt="${entry.addedByName != null ? entry.addedByName : 'Owner'}"
                         loading="lazy" decoding="async">
                    <span th:unless="${entry.ownerSubject != null and userProfileImages[entry.ownerSubject] != null}"
                          class="submitter-avatar submitter-avatar-initial rounded-circle"
                          th:title="${entry.addedByName != null ? entry.addedByName : 'Owner'}"
                          th:text="${#strings.substring(entry.addedByName == null or #strings.isEmpty(entry.addedByName) ? 'O' : entry.addedByName, 0, 1)}">O</span>
                </td>
                <td class="text-end" th:text="${#numbers.formatDecimal(entry.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="text-end text-nowrap">
                    <div th:if="${editableExpenseIds.contains(entry.id)}" class="d-inline-flex gap-1">
                        <button type="button" class="btn btn-sm btn-outline-primary"
                                data-bs-toggle="modal" data-bs-target="#editExpenseModal"
                                th:data-expense-id="${entry.id}"
                                th:data-expense-date="${entry.expenseDate}"
                                th:data-expense-amount="${entry.amount}"
                                th:data-expense-particulars="${entry.particulars}"
                                th:data-expense-category="${entry.category}"
                                aria-label="Edit expense">Edit</button>
                        <form method="post" class="expense-delete-form"
                              th:action="@{/expenses/{id}/delete(id=${entry.id})}"
                              th:data-expense-particulars="${entry.particulars}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-danger" aria-label="Delete expense">Delete</button>
                        </form>
                    </div>
                    <span th:unless="${editableExpenseIds.contains(entry.id)}" class="text-muted">View only</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const openExpenseModal = /*[[${openExpenseModal == true}]]*/ false;
    if (openExpenseModal) {
        bootstrap.Modal.getOrCreateInstance(document.getElementById('expenseModal')).show();
    }

    function showButtonSpinner(button, label) {
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        button.replaceChildren();
        const spinner = document.createElement('span');
        spinner.className = 'spinner-border spinner-border-sm me-2';
        spinner.setAttribute('role', 'status');
        spinner.setAttribute('aria-hidden', 'true');
        button.append(spinner, document.createTextNode(label));
    }

    const editExpenseForm = document.getElementById('editExpenseForm');
    const editExpenseModal = document.getElementById('editExpenseModal');
    let isSavingExpense = false;
    editExpenseModal.addEventListener('hide.bs.modal', (event) => {
        if (isSavingExpense) {
            event.preventDefault();
        }
    });
    document.querySelectorAll('[data-bs-target="#editExpenseModal"]').forEach((button) => {
        button.addEventListener('click', () => {
            editExpenseForm.action = '/expenses/' + button.dataset.expenseId + '/edit';
            document.getElementById('editExpenseDate').value = button.dataset.expenseDate;
            document.getElementById('editExpenseAmount').value = button.dataset.expenseAmount;
            document.getElementById('editExpenseParticulars').value = button.dataset.expenseParticulars;
            document.getElementById('editExpenseCategory').value = button.dataset.expenseCategory;
        });
    });
    editExpenseForm.addEventListener('submit', (event) => {
        if (isSavingExpense) {
            event.preventDefault();
            return;
        }
        isSavingExpense = true;
        editExpenseModal.setAttribute('aria-busy', 'true');
        editExpenseModal.querySelectorAll('[data-bs-dismiss="modal"]').forEach((button) => {
            button.disabled = true;
        });
        showButtonSpinner(editExpenseForm.querySelector('[type="submit"]'), 'Saving...');
    });

    document.querySelectorAll('.expense-delete-form').forEach((form) => {
        let isDeletingExpense = false;
        form.addEventListener('submit', (event) => {
            const particulars = form.dataset.expenseParticulars || 'this expense';
            if (!window.confirm('Delete "' + particulars + '"? This action cannot be undone.')) {
                event.preventDefault();
                return;
            }
            if (isDeletingExpense) {
                event.preventDefault();
                return;
            }
            isDeletingExpense = true;
            showButtonSpinner(form.querySelector('[type="submit"]'), 'Deleting...');
        });
    });
    /*]]>*/
</script>
</body>
</html>
