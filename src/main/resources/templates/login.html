<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17233c; --accent: #5667e8; }
        body { min-height: 100vh; color: var(--ink); background: #f5f7fb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .login-shell { width: min(100%, 980px); min-height: 540px; overflow: hidden; border: 1px solid #e8edf5; border-radius: 1.5rem; background: #fff; box-shadow: 0 24px 80px rgba(34,49,84,.12); }
        .login-art { position: relative; display: flex; min-height: 540px; flex-direction: column; justify-content: space-between; overflow: hidden; padding: 2.5rem; color: #fff; background: linear-gradient(145deg,#4659d7,#7c5ce7 58%,#a56bee); }
        .login-art::before, .login-art::after { position: absolute; content: ""; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; }
        .login-art::before { width: 380px; height: 380px; right: -120px; top: 70px; }
        .login-art::after { width: 260px; height: 260px; right: -60px; top: 130px; }
        .brand-mark { display: inline-flex; width: 40px; height: 40px; align-items: center; justify-content: center; border-radius: 12px; color: #5a5fe0; background: #fff; font-weight: 800; }
        .login-copy { position: relative; z-index: 1; max-width: 330px; }
        .login-content { display: flex; min-height: 540px; flex-direction: column; justify-content: center; padding: clamp(2rem, 6vw, 4.5rem); }
        .btn { min-height: 48px; border-radius: .75rem; font-weight: 600; }
        .btn-outline-primary { color: var(--accent); border-color: #dce1ff; }
        .btn-outline-primary:hover { color: #fff; border-color: var(--accent); background: var(--accent); }
        @media (max-width: 767.98px) { .login-shell { min-height: 0; border-radius: 1.1rem; } .login-art { min-height: 190px; padding: 1.5rem; } .login-copy { max-width: 100%; } .login-copy h2 { font-size: 1.25rem; } .login-copy p, .login-art footer { display: none; } .login-content { min-height: 330px; padding: 2rem; } }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3 p-md-4">
<main class="container-fluid d-flex justify-content-center">
    <div class="login-shell row g-0">
        <section class="col-md-6 login-art">
            <div class="d-flex align-items-center gap-3"><span class="brand-mark">E</span><span class="fw-semibold fs-5">Expense Tracker</span></div>
            <div class="login-copy">
                <h2 class="display-6 fw-semibold mb-3">Spend with clarity.</h2>
                <p class="mb-0 text-white-50">A calmer way to keep project expenses organized and shared with your team.</p>
            </div>
            <footer class="small text-white-50">Your projects. Your spending. In one place.</footer>
        </section>
        <section class="col-md-6 login-content">
            <div>
                <div class="text-uppercase small fw-semibold text-primary mb-2">Welcome</div>
                <h1 class="h2 fw-bold mb-2">Sign in to your account</h1>
                <p class="text-secondary mb-4">Continue securely with your Google account.</p>
                <a class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center" th:href="@{/oauth2/authorization/google}">
                    Continue with Google
                </a>
                <p class="small text-secondary text-center mt-4 mb-0">Secure sign-in powered by Google OAuth</p>
            </div>
        </section>
    </div>
</main>
</body>
</html>
