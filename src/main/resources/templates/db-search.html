<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DB Search | Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17233c; --muted: #748198; --line: #e8edf5; --accent: #5667e8; }
        html, body { min-height: 100%; overflow-x: hidden; }
        body { min-height: 100vh; color: var(--ink); background: #f5f7fb !important; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .navbar { height: 68px; background: rgba(255,255,255,.96) !important; border-bottom: 1px solid var(--line); }
        .navbar-brand { color: var(--ink) !important; letter-spacing: -.03em; }
        .brand-mark { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; margin-right: .55rem; border-radius: 11px; color: #fff; background: linear-gradient(135deg,#6576f5,#8b5cf6); font-weight: 800; }
        .sidebar { width: 248px; top: 68px; height: calc(100vh - 68px); overflow-y: auto; border-color: var(--line) !important; }
        .main-content { box-sizing: border-box; max-width: 100%; }
        .db-search-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 4fr); gap: 1rem; }
        .db-panel { min-width: 0; border: 1px solid var(--line); border-radius: 1rem; background: #fff; box-shadow: 0 5px 22px rgba(34,49,84,.045); }
        .db-table-list { max-height: 70vh; overflow-y: auto; }
        .db-table-link { display: block; padding: .6rem .75rem; border-radius: .65rem; color: #59667d; text-decoration: none; overflow-wrap: anywhere; }
        .db-table-link:hover, .db-table-link.active { color: #4656d2; background: #eef0ff; }
        .db-results { max-height: 70vh; overflow: auto; }
        .db-results table { width: max-content; min-width: 100%; margin-bottom: 0; font-size: .82rem; }
        .db-results th { position: sticky; top: 0; z-index: 1; background: #f8f9fc; color: #748198; font-size: .7rem; text-transform: uppercase; }
        .db-results td, .db-results th { max-width: 360px; padding: .65rem .75rem; vertical-align: top; overflow-wrap: anywhere; }
        @media (min-width: 768px) { .main-content { margin-left: 248px; width: calc(100% - 248px); } }
        @media (max-width: 767.98px) { .navbar { height: 60px; } .db-search-layout { grid-template-columns: 1fr; } .db-table-list { max-height: 220px; } .db-results { max-height: 65vh; } }
    </style>
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-light sticky-top">
    <div class="container-fluid">
        <button class="navbar-toggler d-md-none me-2 border-0 shadow-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu"
                aria-label="Open menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand fw-semibold d-flex align-items-center" href="/">
            <span class="brand-mark">E</span>Expense Tracker
        </a>
        <div th:replace="~{fragments/account-menu :: accountMenu(username=${username}, ownerImageUrl=${ownerImageUrl}, userEmail=${userEmail})}"></div>
    </div>
</nav>

<div th:replace="~{fragments/sidebar :: workspaceSidebar('db-search')}"></div>

<main class="main-content container-fluid px-3 px-md-4 py-4">
    <div class="mb-4">
        <h1 class="h3 mb-1">DB Search</h1>
        <p class="text-muted mb-0">Select a database table to inspect its rows.</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
    <div class="db-search-layout">
        <aside class="db-panel p-3" aria-labelledby="databaseTableListTitle">
            <h2 class="h6 mb-3" id="databaseTableListTitle">Tables</h2>
            <nav class="db-table-list" aria-label="Database tables">
                <a th:each="tableName : ${tableNames}"
                   class="db-table-link"
                   th:classappend="${tableName == selectedTable} ? 'active'"
                   th:attr="aria-current=${tableName == selectedTable} ? 'page' : null"
                   th:href="@{/db-search(table=${tableName})}"
                   th:text="${tableName}">table_name</a>
                <div th:if="${#lists.isEmpty(tableNames)}" class="small text-muted">No tables found.</div>
            </nav>
        </aside>

        <section class="db-panel overflow-hidden" aria-labelledby="selectedTableTitle">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 p-3 border-bottom">
                <h2 class="h6 mb-0" id="selectedTableTitle"
                    th:text="${selectedTable == '' ? 'Selected table data' : selectedTable}">Selected table data</h2>
                <span th:if="${selectedTable != ''}"
                      class="small text-muted"
                      th:text="${rows.size() + (truncated ? '+' : '') + ' rows'}">0 rows</span>
            </div>
            <div th:if="${selectedTable == ''}" class="p-4 text-center text-muted">
                Choose a table from the list to view its data.
            </div>
            <div th:if="${selectedTable != ''}" class="db-results">
                <table class="table table-sm table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th th:each="column : ${columns}" scope="col" th:text="${column}">Column</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td th:colspan="${#lists.size(columns)}" class="text-center text-muted py-4">No rows in this table.</td>
                    </tr>
                    <tr th:each="row : ${rows}">
                        <td th:each="value : ${row}" th:text="${value}">value</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${truncated}" class="small text-muted p-3 border-top">
                Showing the first 100 rows. Binary and large-object fields are summarized.
            </div>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
