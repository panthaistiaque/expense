<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories | Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17233c; --muted: #748198; --accent: #5667e8; --line: #e8edf5; }
        html, body { min-height: 100%; overflow-x: hidden; }
        body { min-height: 100vh; color: var(--ink); background: #f5f7fb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .navbar { height: 68px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); }
        .navbar-brand { color: var(--ink); letter-spacing: -.03em; }
        .brand-mark { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; margin-right: .55rem; border-radius: 11px; color: #fff; background: linear-gradient(135deg,#6576f5,#8b5cf6); font-weight: 800; }
        .sidebar { width: 248px; top: 68px; height: calc(100vh - 68px); overflow-y: auto; border-color: var(--line) !important; }
        .sidebar .nav-link { padding: .7rem .85rem; border-radius: .75rem; color: #66738b; font-weight: 500; }
        .sidebar .nav-link:hover { color: var(--accent); background: #f5f6ff; }
        .sidebar .nav-link.active { background: #eef0ff; color: #4b5bd4; font-weight: 650; }
        .sidebar-label { color: #a0a9ba; font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        .main-content { box-sizing: border-box; max-width: 100%; }
        .page-heading h1 { letter-spacing: -.04em; font-weight: 700; }
        .text-muted { color: var(--muted) !important; }
        .card { border: 1px solid var(--line) !important; border-radius: 1rem; box-shadow: 0 5px 22px rgba(34,49,84,.045); }
        .form-control { min-height: 44px; border-color: #dfe5ef; border-radius: .7rem; }
        .btn { border-radius: .7rem; font-weight: 600; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-outline-light { color: #59667d; border-color: #dfe5ef; }
        @media (min-width: 768px) { .main-content { margin-left: 248px; width: calc(100% - 248px); } }
        @media (max-width: 575.98px) { .navbar { height: 60px; } .main-content { padding-top: 1.25rem !important; } }
    </style>
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-light sticky-top">
    <div class="container-fluid">
        <button class="navbar-toggler d-md-none me-2 border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-label="Open menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand fw-semibold d-flex align-items-center" href="/"><span class="brand-mark">E</span>Expense Tracker</a>
        <div th:replace="~{fragments/account-menu :: accountMenu(username=${username}, ownerImageUrl=${ownerImageUrl}, userEmail=${userEmail})}"></div>
    </div>
</nav>
<div th:replace="~{fragments/sidebar :: workspaceSidebar('categories')}"></div>
<main class="main-content container-fluid px-3 px-md-4 py-4">
    <div class="page-heading mb-4">
        <h1 class="h3 mb-1">Categories</h1>
        <p class="text-muted mb-0">Manage categories available when adding expenses.</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Add a category</h2>
            <form th:action="@{/categories}" th:object="${category}" method="post" class="row g-3 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-8">
                    <label for="categoryName" class="form-label">Category name</label>
                    <input type="text" class="form-control" th:field="*{name}" id="categoryName" maxlength="60" placeholder="e.g. Office supplies" required>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100">Add Category</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Built-in categories</h2>
            <div class="d-flex flex-wrap gap-2">
                <span class="badge rounded-pill text-bg-light border px-3 py-2" th:each="name : ${defaultCategories}" th:text="${name}">Food</span>
            </div>
        </div>
    </div>

    <div class="card overflow-hidden">
        <div class="card-header bg-white py-3">
            <h2 class="h5 mb-0">Your categories</h2>
        </div>
        <div class="list-group list-group-flush">
            <div th:if="${#lists.isEmpty(customCategories)}" class="list-group-item text-center text-muted py-4">
                No custom categories yet.
            </div>
            <div th:each="item : ${customCategories}" class="list-group-item d-flex justify-content-between align-items-center">
                <span th:text="${item.name}">Category</span>
                <form th:action="@{/categories/{id}/delete(id=${item.id})}" method="post" class="m-0"
                      onsubmit="return confirm('Delete this category? Existing expenses will keep their saved category name.');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
